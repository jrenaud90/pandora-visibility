[project]
name = "pandoravisibility"
version = "2.1.0"
description = "A tool for calculating the visibility of targets from Pandora"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["licenses/*"]
authors = [
    { name = "Tom Barclay", email = "barclay.astro@gmail.com" },
    { name = "Joe P. Renaud", email = "joseph.p.renaud@nasa.gov" },
]
maintainers = [
    { name = "Joe P. Renaud", email = "joseph.p.renaud@nasa.gov" },
]
requires-python = ">=3.11,<4.0"
keywords = ["pandora", "astronomy", "spacecraft", "visibility"]
dependencies = [
    "numpy>=2.0",
    "sgp4>=2.25,<3.0",
    "astropy>=7.0",
    "gaiaoffline>=1.0.3,<2.0",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.9,<4.0"]

[project.urls]
Homepage = "https://github.com/PandoraMission/pandora-visibility"
Repository = "https://github.com/PandoraMission/pandora-visibility"
Changelog = "https://github.com/PandoraMission/pandora-visibility/blob/main/CHANGES.md"
Issues = "https://github.com/PandoraMission/pandora-visibility/issues"

[tool.poetry]
packages = [{ include = "pandoravisibility", from = "src" }]

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
pytest = "^8.3.4"
black = "^26.1.0"
isort = "^6.0.0"
pluggy = "^1.5.0"
packaging = "^24.0"
pytest-cov = "^7.0.0"


[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::astropy.coordinates.baseframe.NonRotationTransformationWarning",
]

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"
